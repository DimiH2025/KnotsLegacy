name: Container images (Umbrel / StartOS)

# Builds the Knots Legacy node image and the DATUM gateway image for amd64 and
# arm64 on native runners (no emulation) and publishes a multi-arch tag to
# GitHub Container Registry. Run it by hand, or publish a GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (for example 29.3.knots20261124)"
        required: true
        default: "29.3.knots20261124"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: knots-legacy-node,  context: ".",                           file: packaging/docker/knots-legacy-node/Dockerfile,  platform: linux/amd64, runner: ubuntu-24.04,     suffix: amd64 }
          - { image: knots-legacy-node,  context: ".",                           file: packaging/docker/knots-legacy-node/Dockerfile,  platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
          - { image: knots-legacy-datum,   context: packaging/docker/knots-legacy-datum, file: packaging/docker/knots-legacy-datum/Dockerfile,   platform: linux/amd64, runner: ubuntu-24.04,     suffix: amd64 }
          - { image: knots-legacy-datum,   context: packaging/docker/knots-legacy-datum, file: packaging/docker/knots-legacy-datum/Dockerfile,   platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase registry owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.image }}-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [knots-legacy-node, knots-legacy-datum]
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}"
          # Registry paths must be lower case.
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools create -t "$IMAGE:$TAG" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"
